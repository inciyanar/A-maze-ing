[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "42 A-Maze-ing Project by incyanar & edpolat"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Eda Nur Polat", email = "edanurpolat03@gmail.com"}, 
    {name = "İnci Yanar", email = "incinuryanar117@gmail.com"}
]
keywords = ["maze", "42", "perfect-maze"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[tool.setuptools]
py-modules = ["maze_ing", "pars_ing", "render", "output_file_helpers"]
